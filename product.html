<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details — FRASMETICS PARIS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div id="toastContainer" class="toast-container"></div>

  <div class="drapeau-strip">
    <div class="drapeau-bleu"></div>
    <div class="drapeau-blanc"></div>
    <div class="drapeau-rouge"></div>
  </div>

  <header class="main-header">
    <div class="nav-container">
      <a href="index.html" class="brand-logo-clean">
        <svg class="brand-monogram-svg" viewBox="0 0 60 80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="15" y="10" width="35" height="10" fill="#FFFFFF"/>
          <rect x="15" y="30" width="25" height="10" fill="#FFFFFF"/>
          <rect x="15" y="0" width="10" height="75" fill="#FFFFFF"/>
        </svg>
        <span class="brand-text-logo">FRASMETICS</span>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="collection.html" class="nav-link active">Collection</a></li>
          <li><a href="custom-studio.html" class="nav-link">Studio</a></li>
          <li><a href="pyramid.html" class="nav-link">Pyramid</a></li>
          <li><a href="quiz.html" class="nav-link">Quiz</a></li>
          <li><a href="charter.html" class="nav-link">Charter</a></li>
          <li><a href="reviews.html" class="nav-link">Reviews</a></li>
        </ul>
      </nav>

      <div class="header-actions">
        <button id="soundToggleBtn" onclick="toggleAudioFx()" style="background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 6px 12px; font-family: var(--font-unbounded); font-size: 0.7rem; cursor: pointer;">
          <i class="fa-solid fa-volume-high"></i> SOUND: ON
        </button>

        <div class="currency-selector">
          <select id="currencySelect" onchange="changeCurrency(this.value)" style="background: transparent; color: white; border: 1px solid rgba(255,255,255,0.2); padding: 4px 8px; font-family: var(--font-unbounded); font-size: 0.7rem; cursor: pointer;">
            <option value="EUR">EUR (€)</option>
            <option value="USD">USD ($)</option>
            <option value="GBP">GBP (£)</option>
            <option value="INR">INR (₹)</option>
          </select>
        </div>
        <button class="icon-btn" onclick="openSearchModal()"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button class="icon-btn" onclick="toggleCartDrawer()"><i class="fa-solid fa-bag-shopping"></i><span class="cart-badge" id="cartCountBadge">0</span></button>
      </div>
    </div>
  </header>

  <section style="padding: 80px 32px; min-height: 85vh; max-width: 1280px; margin: 0 auto;">
    <div id="productDetailContainer">
      <!-- Dynamic JS Content -->
    </div>
  </section>

  <!-- Slide-out Drawer Cart -->
  <div class="cart-drawer-overlay" id="cartOverlay" onclick="toggleCartDrawer()"></div>
  <aside class="cart-drawer" id="cartDrawer">
    <div class="cart-header">
      <h3 style="font-size: 1.1rem;"><i class="fa-solid fa-bag-shopping"></i> YOUR CART (<span id="drawerCartCount">0</span>)</h3>
      <button class="icon-btn" onclick="toggleCartDrawer()">&times;</button>
    </div>
    <div id="cartItemsBody" style="flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px;"></div>
    <div style="padding: 24px; border-top: var(--hairline); background: #04060E;">
      <a href="cart.html" class="gokwik-fast-btn" style="text-decoration: none;">
        <span>⚡ PROCEED TO CHECKOUT</span>
      </a>
    </div>
  </aside>

  <script src="app.js"></script>
  <script>
    function renderSingleProductPage() {
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id') || 'hdo50';
      const p = PRODUCTS.find(prod => prod.id === productId) || PRODUCTS[0];
      const selectedVol = selectedVolumes[p.id] || 50;
      const currentImg = selectedVol === 20 ? p.img20 : p.img50;

      const container = document.getElementById('productDetailContainer');
      if (!container) return;

      container.innerHTML = `
        <div style="display: grid; grid-template-columns: 1fr 1.1fr; gap: 60px; align-items: center;">
          <div class="product-img-box" style="height: 480px;">
            <img src="${currentImg}" alt="${p.name}" id="singleProductImg">
            <span class="badge-overlay">${p.badge}</span>
          </div>

          <div>
            <span class="eyebrow-ruled">${p.number}</span>
            <h1 style="font-size: 2.8rem; margin-bottom: 6px;">${p.name}</h1>
            <p class="french-flourish" style="margin-bottom: 16px;">"${p.italic}"</p>
            <p style="font-family: var(--font-unbounded); font-size: 0.92rem; color: #CBD5E0; line-height: 1.8; margin-bottom: 24px;">${p.desc}</p>

            <div class="notes-hairline-grid" style="margin-bottom: 24px;">
              <div class="note-cell" style="padding: 12px 8px;">
                <div class="note-cell-label">Tête · Top</div>
                <div class="note-cell-value" style="font-size: 0.85rem; color: white;">${p.tete}</div>
              </div>
              <div class="note-cell" style="padding: 12px 8px;">
                <div class="note-cell-label">Cœur · Heart</div>
                <div class="note-cell-value" style="font-size: 0.85rem; color: white;">${p.coeur}</div>
              </div>
              <div class="note-cell" style="padding: 12px 8px;">
                <div class="note-cell-label">Fond · Base</div>
                <div class="note-cell-value" style="font-size: 0.85rem; color: white;">${p.fond}</div>
              </div>
            </div>

            <div style="margin-bottom: 24px;">
              <label style="font-size: 0.75rem; color: #A0AEC0; font-weight: 700; margin-bottom: 8px; display: block;">SELECT VOLUME:</label>
              <div class="volume-selector">
                <button class="vol-btn ${selectedVol === 20 ? 'active' : ''}" onclick="changeSingleVol('${p.id}', 20)">20 ML — ${formatPrice(p.prices[20])}</button>
                <button class="vol-btn ${selectedVol === 50 ? 'active' : ''}" onclick="changeSingleVol('${p.id}', 50)">50 ML — ${formatPrice(p.prices[50])}</button>
              </div>
            </div>

            <div style="display: flex; align-items: baseline; gap: 16px; margin-bottom: 32px;">
              <span style="font-size: 2.2rem; font-weight: 900; color: white;">${formatPrice(p.prices[selectedVol])}</span>
              <span style="text-decoration: line-through; color: #718096; font-size: 1.2rem;">${formatPrice(p.oldPrices[selectedVol])}</span>
              <span class="discount-badge">${p.discount}</span>
            </div>

            <div style="display: flex; gap: 16px;">
              <button class="btn-sarkar-primary" style="flex: 1; justify-content: center; padding: 18px;" onclick="buyNowDirect('${p.id}')">
                ACQUIRE NOW — ${p.name.split(' ')[0]}
              </button>
              <button class="btn-add-cart" style="padding: 18px 24px; color: white; border-color: white;" onclick="addToCart('${p.id}')">
                <i class="fa-solid fa-bag-shopping"></i> ADD TO BAG
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function changeSingleVol(id, vol) {
      selectedVolumes[id] = vol;
      renderSingleProductPage();
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderSingleProductPage();
    });
  </script>
</body>
</html>
